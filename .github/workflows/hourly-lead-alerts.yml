# Enquiry alerts, on demand.
#
# The hourly schedule is disabled: it needs a CRON_SECRET repo secret that isn't
# set, so every run failed and mailed a failure notice. Alerts still go out via
# the daily cron in vercel.json (`/api/cron/lead-alerts`, 07:00 UTC).
#
# To bring the hourly cadence back: add CRON_SECRET under Settings → Secrets and
# variables → Actions (same value as the Vercel env var), then restore the
# `schedule:` block below. The endpoint claims rows via `alertedAt`, so the
# hourly and daily schedules overlapping can never alert the same lead twice.
name: Hourly lead alerts

on:
  # schedule:
  #   - cron: "0 * * * *"
  # Lets the owner fire a run by hand from the Actions tab.
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger enquiry alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings → Secrets and variables → Actions, using the same value as the Vercel environment variable."
            exit 1
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.yaffotlv.com/api/cron/lead-alerts)
          echo "HTTP $code"
          cat response.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Alert endpoint returned $code"
            exit 1
          fi
