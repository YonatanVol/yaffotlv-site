<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>StickerPack</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #fff;
      width: 320px;
      min-height: 120px;
      padding: 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h1 { font-size: 15px; font-weight: 700; }
    #settings-link {
      font-size: 16px;
      text-decoration: none;
      line-height: 1;
      color: #64748b;
    }
    #settings-link:hover { color: #1e293b; }
    #status {
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    #select-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    #select-row label { color: #64748b; font-size: 12px; cursor: pointer; }
    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .sticker-cell {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 2px solid #e2e8f0;
      overflow: hidden;
      cursor: pointer;
      background: #f8fafc;
    }
    .sticker-cell.selected { border-color: #6366f1; }
    .sticker-cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .sticker-cell .check {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #6366f1;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .sticker-cell.selected .check { display: flex; }
    .check svg { width: 10px; height: 10px; fill: #fff; }
    #import-btn {
      width: 100%;
      padding: 8px 0;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #import-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    #import-btn:not(:disabled):hover { background: #4f46e5; }
    #clear-btn {
      width: 100%;
      padding: 6px 0;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
    }
    #clear-btn:hover { color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>StickerPack</h1>
    <a id="settings-link" href="settings.html" target="_blank" title="Settings">&#9881;</a>
  </header>
  <p id="status">Open TikTok, reply to a comment, and tap the sticker button. Stickers will appear here.</p>
  <div id="select-row" style="display:none">
    <input type="checkbox" id="select-all" checked />
    <label for="select-all">Select all</label>
    <span id="count-label" style="margin-left:auto;color:#64748b;font-size:12px;"></span>
  </div>
  <div id="grid"></div>
  <button id="import-btn" disabled>Import to WhatsApp</button>
  <button id="clear-btn" style="display:none">Clear captured stickers</button>
  <script src="popup.js"></script>
</body>
</html>
