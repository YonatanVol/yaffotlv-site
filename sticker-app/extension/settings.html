<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>StickerPack – Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1e293b;
      background: #fff;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 24px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="url"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input[type="url"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px #e0e7ff;
    }
    button {
      padding: 8px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    #saved {
      display: none;
      margin-left: 12px;
      color: #16a34a;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>StickerPack Settings</h1>
  <p>
    Enter the URL of your StickerPack web app. This is where captured stickers
    will be sent when you click "Import to WhatsApp" in the popup.
  </p>
  <label for="app-url">StickerPack app URL</label>
  <input
    id="app-url"
    type="url"
    placeholder="https://your-app.vercel.app"
    value=""
  />
  <button id="save-btn">Save</button>
  <span id="saved">Saved!</span>
  <script src="settings.js"></script>
</body>
</html>
